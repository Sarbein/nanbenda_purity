<script>
// ══════════════════════════════════════
// SUPABASE DATABASE LAYER
// Multi-user shared database
// ══════════════════════════════════════
var STORES = ['products','sales','whatsapp','invoices'];
var SB_URL = '';
var SB_KEY = '';

function sbLoad(){
  try{
    SB_URL = localStorage.getItem('sb_url')||'';
    SB_KEY = localStorage.getItem('sb_key')||'';
  }catch(e){}
}

function sbSave(url, key){
  SB_URL = url; SB_KEY = key;
  try{ localStorage.setItem('sb_url', url); localStorage.setItem('sb_key', key); }catch(e){}
}

function sbReady(){ return SB_URL && SB_KEY; }

function sbHeaders(){
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Prefer': 'return=representation'
  };
}

// Map store names to Supabase table names
function tbl(store){
  var map = {products:'products', sales:'sales', whatsapp:'whatsapp_logs', invoices:'invoices'};
  return map[store] || store;
}

async function getAll(store){
  if(!sbReady()) return [];
  try{
    const res = await fetch(SB_URL+'/rest/v1/'+tbl(store)+'?order=created_at.desc&limit=500', {
      headers: sbHeaders()
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.message||res.status); }
    return await res.json();
  }catch(e){ toast('DB read error: '+e.message, true); return []; }
}

async function dbAdd(store, data){
  if(!sbReady()) return null;
  // Remove local id — Supabase generates UUID
  const body = Object.assign({}, data);
  delete body.id;
  body.created_at = new Date().toISOString();
  try{
    const res = await fetch(SB_URL+'/rest/v1/'+tbl(store), {
      method:'POST', headers: sbHeaders(), body: JSON.stringify(body)
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.message||res.status); }
    const rows = await res.json();
    return rows[0]||null;
  }catch(e){ toast('DB add error: '+e.message, true); return null; }
}

async function dbPut(store, data){
  if(!sbReady()) return null;
  const id = data.id;
  const body = Object.assign({}, data);
  delete body.id;
  try{
    const res = await fetch(SB_URL+'/rest/v1/'+tbl(store)+'?id=eq.'+id, {
      method:'PATCH', headers: sbHeaders(), body: JSON.stringify(body)
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.message||res.status); }
    const rows = await res.json();
    return rows[0]||null;
  }catch(e){ toast('DB update error: '+e.message, true); return null; }
}

async function dbDel(store, id){
  if(!sbReady()) return;
  try{
    const res = await fetch(SB_URL+'/rest/v1/'+tbl(store)+'?id=eq.'+id, {
      method:'DELETE', headers: sbHeaders()
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.message||res.status); }
  }catch(e){ toast('DB delete error: '+e.message, true); }
}

// For stock update — patch only stock & status fields on a product
async function dbPatchProduct(id, fields){
  if(!sbReady()) return;
  try{
    const res = await fetch(SB_URL+'/rest/v1/products?id=eq.'+id, {
      method:'PATCH', headers: sbHeaders(), body: JSON.stringify(fields)
    });
    if(!res.ok){ const e=await res.json(); throw new Error(e.message||res.status); }
  }catch(e){ toast('Stock update error: '+e.message, true); }
}

function initDB(){ sbLoad(); }

// ══════════════════════════════════════
// Helpers
// ══════════════════════════════════════
const fmt = n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today = ()=>new Date().toISOString().slice(0,10);
const rowBg = i=>i%2?'background:#f5f3f3':'';
const chip = s=>{
  const m={Active:'chip-green','Low Stock':'chip-amber',Inactive:'chip-grey',Paid:'chip-green',Unpaid:'chip-amber',Overdue:'chip-red',Pending:'chip-amber',Responded:'chip-green',Fulfilled:'chip-g[...]
  return `<span class="${m[s]||'chip-grey'} text-[11px] font-semibold px-2 py-0.5 rounded-full">${s}</span>`;
};

function toast(msg,err){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.style.background=err?'#ba1a1a':'#2d5a27';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

function closeM(id){ const el=document.getElementById(id); el.style.display='none'; }
function openM(id){ const el=document.getElementById(id); el.style.display='flex'; }

async function updateDBBadge(){
  const [p,s,w,i] = await Promise.all(STORES.map(getAll));
  document.getElementById('db-status-text').textContent = sbReady() ? 'Supabase Connected ✓' : '⚠ Not Connected';
  document.getElementById('db-record-count').textContent=`${p.length} products · ${s.length} sales · ${w.length} logs · ${i.length} invoices`;
}

// ══════════════════════════════════════
// Navigation
// ══════════════════════════════════════
let sidebarOpen=true;
function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  document.getElementById('sidebar').style.transform=sidebarOpen?'':'translateX(-100%)';
  document.getElementById('main-content').style.marginLeft=sidebarOpen?'18rem':'0';
}

function showPage(p){
  document.querySelectorAll('.page').forEach(el=>{ el.classList.remove('active'); el.style.display='none'; });
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('nav-active'));
  const el=document.getElementById('page-'+p);
  if(!el) return;
  el.style.display = p==='ai' ? 'flex' : 'block';
  if(p!=='ai') el.classList.add('active');
  el.classList.add('fade-in');
  const nav=document.getElementById('nav-'+p);
  if(nav) nav.classList.add('nav-active');
  if(p==='dashboard') buildDashboard();
  if(p==='products') renderProducts();
  if(p==='sales') renderSales();
  if(p==='whatsapp') renderWA();
  if(p==='finance') renderFinance();
  if(p==='reports') buildReports();
}

// ══════════════════════════════════════
// Dashboard
// ══════════════════════════════════════
async function buildDashboard(){
  const [prods,sales]=[await getAll('products'),await getAll('sales')];
  const rev=sales.reduce((a,s)=>a+(s.qty*s.price),0);
  const cost=sales.reduce((a,s)=>a+(s.qty*(s.cost_price||s.costPrice||0)),0);
  document.getElementById('d-products').textContent=prods.length;
  document.getElementById('d-sales').textContent=sales.length;
  document.getElementById('d-revenue').textContent=fmt(rev);
  document.getElementById('d-profit').textContent=fmt(rev-cost);
  const recent=[...sales].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5);
  const tbody=document.getElementById('d-recent');
  tbody.innerHTML=recent.length?recent.map((s,i)=>`
    <tr style="${rowBg(i)}" class="border-b border-[#D1CDC2]">
      <td class="px-6 py-3 text-xs text-stone-500">${s.date||''}</td>
      <td class="px-6 py-3 font-medium text-stone-800">${s.product_name||s.productName||''}</td>
      <td class="px-6 py-3 text-stone-600">${s.customer||'—'}</td>
      <td class="px-6 py-3 text-right">${s.qty}</td>
      <td class="px-6 py-3 text-right font-semibold text-[#154212]">${fmt(s.qty*s.price)}</td>
    </tr>`).join(''):'<tr><td colspan="5" class="px-6 py-8 text-center text-stone-400 text-sm">No sales yet</td></tr>';
}

// ══════════════════════════════════════
// Products
// ══════════════════════════════════════
async function renderProducts(){
  const all = await getAll('products');
  const q=(document.getElementById('prod-search')?.value||'').toLowerCase();
  const sf=document.getElementById('prod-sf')?.value||'';
  const list=all.filter(p=>p.name.toLowerCase().includes(q)&&(sf===''||p.status===sf));
  document.getElementById('prod-count').textContent=`${list.length} product${list.length!==1?'s':''} shown`;
  const tbody=document.getElementById('prod-tbody');
  if(!list.length){
    tbody.innerHTML='<tr><td colspan="7" class="px-6 py-10 text-center text-stone-400">No products found.</td></tr>';
    return;
  }
  tbody.innerHTML='';
  list.forEach(function(p, i){
    const m = p.sell>0 ? ((p.sell-p.cost)/p.sell*100).toFixed(1) : '—';
    const stock = p.stock !== undefined ? p.stock : '—';
    const lowLevel = p.lowStock || 10;
    const stockNum = Number(p.stock);
    const stockColor = isNaN(stockNum)||p.stock===undefined ? '#42493e'
                     : stockNum <= 0 ? '#ba1a1a'
                     : stockNum <= lowLevel ? '#d97706'
                     : '#16a34a';
    const stockLabel = isNaN(stockNum)||p.stock===undefined ? '—'
                     : stockNum <= 0 ? stockNum+' ⚠ OUT'
                     : stockNum <= lowLevel ? stockNum+' ⚠ LOW'
                     : stockNum;
    const tr = document.createElement('tr');
    tr.style.background = i%2 ? '#f5f3f3' : '';
    tr.className = 'border-b border-[#D1CDC2]';
    tr.innerHTML =
      '<td class="px-6 py-3 font-medium text-stone-800">'+p.name+'</td>'+
      '<td class="px-6 py-3 text-right text-stone-600">'+fmt(p.cost)+'</td>'+
      '<td class="px-6 py-3 text-right font-semibold text-[#154212]">'+fmt(p.sell)+'</td>'+
      '<td class="px-6 py-3 text-right font-semibold" style="color:'+(parseFloat(m)>=15?'#16a34a':'#d97706')+'">'+m+'%</td>'+
      '<td class="px-6 py-3 text-right font-bold" style="color:'+stockColor+'">'+stockLabel+'</td>'+
      '<td class="px-6 py-3 text-center">'+chip(p.status)+'</td>'+
      '<td class="px-6 py-3 text-center flex items-center justify-center gap-1"></td>';
    // Stock adjust button
    const adjBtn = document.createElement('button');
    adjBtn.className = 'p-1.5 rounded hover:bg-blue-50 transition-colors';
    adjBtn.title = 'Adjust Stock';
    adjBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]" style="color:#2d5a27">inventory</span>';
    adjBtn.addEventListener('click', function(){ openStockModal(p); });
    // Edit button
    const editBtn = document.createElement('button');
    editBtn.className = 'p-1.5 rounded hover:bg-stone-200 transition-colors';
    editBtn.title = 'Edit Product';
    editBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] text-stone-500">edit</span>';
    editBtn.addEventListener('click', function(){ editProduct(p); });
    // Delete button
    const delBtn = document.createElement('button');
    delBtn.className = 'p-1.5 rounded hover:bg-red-50 transition-colors';
    delBtn.title = 'Delete Product';
    delBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] text-red-400">delete</span>';
    delBtn.addEventListener('click', function(){ openDelModal(p, p.name); });
    tr.lastElementChild.appendChild(adjBtn);
    tr.lastElementChild.appendChild(editBtn);
    tr.lastElementChild.appendChild(delBtn);
    tbody.appendChild(tr);
  });
}

function openProductModal(){
  document.getElementById('pm-id').value='';
  document.getElementById('pm-title').textContent='Add Product';
  ['pm-name','pm-cost','pm-sell','pm-notes'].forEach(x=>document.getElementById(x).value='');
  document.getElementById('pm-stock').value='0';
  document.getElementById('pm-lowstock').value='10';
  document.getElementById('pm-cat').value='Rice';
  document.getElementById('pm-status').value='Active';
  document.getElementById('pm-mprev').classList.add('hidden');
  openM('pm');
}

async function editProduct(p){
  if(!p) return;
  document.getElementById('pm-id').value=p.id;
  document.getElementById('pm-title').textContent='Edit Product';
  document.getElementById('pm-name').value=p.name;
  document.getElementById('pm-cost').value=p.cost;
  document.getElementById('pm-sell').value=p.sell;
  document.getElementById('pm-stock').value=p.stock||0;
  document.getElementById('pm-lowstock').value=p.lowStock||10;
  document.getElementById('pm-cat').value=p.category||'Rice';
  document.getElementById('pm-status').value=p.status||'Active';
  document.getElementById('pm-notes').value=p.notes||'';
  calcMP(); openM('pm');
}

function calcMP(){
  const c=parseFloat(document.getElementById('pm-cost').value)||0;
  const s=parseFloat(document.getElementById('pm-sell').value)||0;
  const prev=document.getElementById('pm-mprev'), val=document.getElementById('pm-mval');
  if(c>0&&s>0){ const m=((s-c)/s*100).toFixed(1); val.textContent=m+'%'; val.style.color=parseFloat(m)>=0?'#154212':'#ba1a1a'; prev.classList.remove('hidden'); }
  else prev.classList.add('hidden');
}

async function saveProduct(){
  try {
    const id = document.getElementById('pm-id').value;
    const name = document.getElementById('pm-name').value.trim();
    const costRaw = document.getElementById('pm-cost').value;
    const sellRaw = document.getElementById('pm-sell').value;
    const cost = parseFloat(costRaw);
    const sell = parseFloat(sellRaw);
    const stock = parseInt(document.getElementById('pm-stock').value) || 0;
    const lowStock = parseInt(document.getElementById('pm-lowstock').value) || 10;
    if(!name){ toast('Product name is required.',true); return; }
    if(costRaw===''||isNaN(cost)){ toast('Enter a valid cost price.',true); return; }
    if(sellRaw===''||isNaN(sell)){ toast('Enter a valid selling price.',true); return; }
    const data = {
      name, cost, sell, stock,
      low_stock: lowStock,
      category: document.getElementById('pm-cat').value,
      status: document.getElementById('pm-status').value,
      notes: document.getElementById('pm-notes').value.trim()
    };
    if(id){
      await dbPut('products', {...data, id: id});
      toast('Product updated!');
    } else {
      await dbAdd('products', data);
      toast('Product added!');
    }
    closeM('pm');
    await renderProducts();
    await updateDBBadge();
  } catch(e) {
    toast('Error saving: ' + (e.message||e), true);
    console.error('saveProduct error:', e);
  }
}

async function openSaleModal(){
  const prods=await getAll('products');
  const sel=document.getElementById('sm-product');
  sel.innerHTML='<option value="">— Select product —</option>'+prods.map(p=>`<option value="${p.id}" data-price="${p.sell}" data-cost="${p.cost}" data-stock="${p.stock!==undefined?p.stock:''}[...]
  document.getElementById('sm-stock-info').style.display='none';
  document.getElementById('sm-qty').value=1;
  document.getElementById('sm-price').value='';
  document.getElementById('sm-customer').value='';
  document.getElementById('sm-date').value=today();
  document.getElementById('sm-notes').value='';
  document.getElementById('sm-tprev').classList.add('hidden');
  openM('sm');

async function sendAI(){
  const input=document.getElementById('ai-input');
  const msg=input.value.trim(); if(!msg) return;
  input.value='';
  appendBubble('user',msg);
  chatHistory.push({role:'user',content:msg});
  document.getElementById('ai-btn').disabled=true;
  showTyping();
  try{
    const sys=await buildContext();
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:sys,messages:chatHistory})
    });
    const data=await res.json();
    removeTyping();
    if(data.error){ appendBubble('assistant','⚠️ API error: '+data.error.message); return; }
    const reply=data.content?.[0]?.text||'No response.';
    chatHistory.push({role:'assistant',content:reply});
    appendBubble('assistant',reply);
  }catch(err){
    removeTyping();
    appendBubble('assistant','⚠️ Could not reach Claude API. Check your network connection.');
  }finally{ document.getElementById('ai-btn').disabled=false; }
}
